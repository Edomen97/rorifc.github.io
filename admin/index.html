<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rori FC - Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Admin Dashboard</h2>
            <p>ወደ አስተዳዳሪ ገጽ ለመግባት መረጃዎን ያስገቡ</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">ኢሜል (Email)</label>
                    <input type="email" id="email" required placeholder="admin@rorifc.com">
                </div>
                <div class="input-group">
                    <label for="password">የይለፍ ቃል (Password)</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <p id="error-message" class="error"></p>
                <button type="submit" id="login-btn">ግባ (Login)</button>
            </form>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
<div class="news-section">
    <h3>በቅርብ የተጨመሩ መረጃዎች</h3>
    <div id="newsList"></div>
</div>
