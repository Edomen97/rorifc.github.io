<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rori FC - Admin Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <!-- አይከን (Icons) ለመጠቀም -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="dashboard-body">

    <!-- የጎንዮሽ ምናሌ (Sidebar) -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <h2>Rori FC <span>Admin</span></h2>
        </div>
        <ul class="nav-links">
            <li class="active"><a href="#"><i class="fas fa-home"></i> ዳሽቦርድ (Dashboard)</a></li>
            <li><a href="#"><i class="fas fa-users"></i> ተጫዋቾች (Players)</a></li>
            <li><a href="#"><i class="fas fa-newspaper"></i> ዜናዎች (News)</a></li>
            <li><a href="#"><i class="fas fa-table"></i> የሊግ ሰንጠረዥ (Table)</a></li>
        </ul>
        <button id="logout-btn" class="logout-btn"><i class="fas fa-sign-out-alt"></i> ውጣ (Logout)</button>
    </nav>

    <!-- ዋናው ገጽ (Main Content) -->
    <main class="main-content">
        <header class="top-header">
            <h1>እንኳን ደህና መጡ፣ <span id="admin-name">አስተዳዳሪ</span>! 👋</h1>
        </header>

        <section class="stats-grid">
            <div class="stat-card">
                <i class="fas fa-users"></i>
                <div class="stat-info">
                    <h3>ጠቅላላ ተጫዋቾች</h3>
                    <p id="total-players">43</p>
                </div>
            </div>
            <div class="stat-card">
                <i class="fas fa-newspaper"></i>
                <div class="stat-info">
                    <h3>የወጡ ዜናዎች</h3>
                    <p id="total-news">0</p>
                </div>
            </div>
        </section>

        <section class="recent-activity">
            <h2>በቅርብ የተጨመሩ መረጃዎች</h2>
            <div class="activity-box">
                <p>እስካሁን ምንም አዲስ መረጃ አልተጨመረም።</p>
            </div>
        </section>
    </main>

    <script type="module" src="dashboard.js"></script>
</body>
</html>
