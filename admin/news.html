<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>አድሚን - ዜና መዝጋቢ</title>
    <style>
        body { font-family: sans-serif; background: #0b132b; color: #ffffff; padding: 20px; }
        .form-container { max-width: 500px; margin: 30px auto; background: #1c2541; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { text-align: center; color: #ffcc00; margin-bottom: 20px; }
        label { display: block; margin-top: 10px; font-weight: bold; color: #d1d5db; }
        input, textarea, button { width: 100%; padding: 12px; margin-top: 5px; border-radius: 6px; border: 1px solid #3a506b; background: #0b132b; color: #fff; box-sizing: border-box; }
        button { background: #ffcc00; color: #000; font-weight: bold; margin-top: 20px; cursor: pointer; border: none; font-size: 1rem; }
        button:hover { background: #e6b800; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>📰 አዲስ ዜና መዝግብ</h2>
        <form id="newsForm">
            <label>የዜናው ርዕስ</label>
            <input type="text" id="newsTitle" required placeholder="ርዕስ ያስገቡ">

            <label>ቀን</label>
            <input type="date" id="newsDate" required>

            <label>የምስል ሊንክ (Image URL - አማራጭ)</label>
            <input type="url" id="newsImage" placeholder="https://example.com/image.jpg">

            <label>የዜናው ዝርዝር</label>
            <textarea id="newsContent" rows="5" required placeholder="የዜናውን ዝርዝር ጽሁፍ እዚህ ይፃፉ..."></textarea>

            <button type="submit">ዜና ጨምር</button>
        </form>
    </div>

    <!-- Firebase Script Connection -->
    <script type="module" src="news.js"></script>
</body>
</html>
