<!DOCTYPE html>
<html lang="am">
<head>
   <div class="table-card">
    <h2>የሊግ ሰንጠረዥ</h2>
    <table border="1" style="width: 100%; border-collapse: collapse; text-align: center; margin-top: 15px;">
        <thead style="background: #1a252f; color: white;">
            <tr>
                <th>ደረጃ</th>
                <th>ቡድን</th>
                <th>ተጫወተ</th>
                <th>አሸነፈ</th>
                <th>አቻ</th>
                <th>ተሸነፈ</th>
                <th>ግብ ልዩነት</th>
                <th>ነጥብ</th>
            </tr>
        </thead>
        <tbody id="leagueTableBody">
            <!-- መረጃው በ JavaScript እዚህ ይገባል -->
        </tbody>
    </table>
</div>

<!-- ከገጹ ስር JS ፋይሉ መኖሩን አረጋግጥ -->
<script src="app.js"></script>
 <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rori FC - Admin Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <h2>Admin Dashboard</h2>
            <p>ወደ አስተዳዳሪ ገጽ ለመግባት መረጃዎን ያስገቡ</p>
            <form id="login-form">
                <div class="input-group">
                    <label for="email">ኢሜል (Email)</label>
                    <input type="email" id="email" required placeholder="admin@rorifc.com">
                </div>
                <div class="input-group">
                    <label for="password">የይለፍ ቃል (Password)</label>
                    <input type="password" id="password" required placeholder="********">
                </div>
                <p id="error-message" class="error"></p>
                <button type="submit" id="login-btn">ግባ (Login)</button>
            </form>
        </div>
    </div>
    
    <script type="module" src="app.js"></script>
</body>
</html>
<div class="news-section">
    <h3>በቅርብ የተጨመሩ መረጃዎች</h3>
    <div id="newsList"></div>
</div>
    <!-- የዜና ማሳያ ክፍል -->
    <section id="news-section" style="max-width: 1000px; margin: 40px auto; padding: 20px;">
        <h2 style="text-align: center; color: #1a252f; border-bottom: 2px solid #007bff; padding-bottom: 10px;">📰 የቅርብ ጊዜ ዜናዎች</h2>
        <div id="newsContainer" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-top: 20px;">
            <!-- ከ Firebase የሚመጡ ዜናዎች እዚህ ይገባሉ -->
        </div>
    </section>

    <script type="module" src="script.js"></script>
</body>
</html>
